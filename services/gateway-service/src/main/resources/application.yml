server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
    gateway:
      server:
        webflux:
          routes:
            - id: course-service-smoke
              uri: lb://course-service
              predicates:
                - Path=/_internal/smoke/course
              filters:
                - SetPath=/internal/info
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
            - id: student-service
              uri: lb://student-service
              predicates:
                - Path=/api/v1/students/**
            - id: course-service
              uri: lb://course-service
              predicates:
                - Path=/api/v1/courses/**,/api/v1/semesters/**,/api/v1/teachers/**,/api/v1/course-offerings/**
            - id: enrollment-service
              uri: lb://enrollment-service
              predicates:
                - Path=/api/v1/enrollments/**,/api/v1/enrollment-requests/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    phase: 1-skeleton

springdoc:
  swagger-ui:
    path: /swagger-ui.html
