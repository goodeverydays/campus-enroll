server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: enrollment-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/campus_enrollment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_APP_USER:campus_app}
    password: ${MYSQL_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:campus_app}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/campus-enroll}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    phase: 6-reliable-messaging

campus:
  clients:
    student-base-url: ${STUDENT_SERVICE_BASE_URL:http://localhost:8082}
    course-base-url: ${COURSE_SERVICE_BASE_URL:http://localhost:8083}
  messaging:
    exchange: ${ENROLLMENT_EXCHANGE:campus.enrollment.exchange}
    queue: ${ENROLLMENT_QUEUE:campus.enrollment.queue}
    routing-key: ${ENROLLMENT_ROUTING_KEY:campus.enrollment.requested}
    confirm-timeout: ${ENROLLMENT_CONFIRM_TIMEOUT:5s}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
