server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: enrollment-worker
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/campus_enrollment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_APP_USER:campus_app}
    password: ${MYSQL_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:campus_app}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/campus-enroll}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    phase: 6-reliable-messaging

campus:
  clients:
    course-base-url: ${COURSE_SERVICE_BASE_URL:http://localhost:8083}
  messaging:
    exchange: ${ENROLLMENT_EXCHANGE:campus.enrollment.exchange}
    queue: ${ENROLLMENT_QUEUE:campus.enrollment.queue}
    routing-key: ${ENROLLMENT_ROUTING_KEY:campus.enrollment.requested}
    retry-exchange: ${ENROLLMENT_RETRY_EXCHANGE:campus.enrollment.retry.exchange}
    retry-queue: ${ENROLLMENT_RETRY_QUEUE:campus.enrollment.retry.queue}
    retry-routing-key: ${ENROLLMENT_RETRY_ROUTING_KEY:campus.enrollment.retry}
    dead-letter-exchange: ${ENROLLMENT_DLX:campus.enrollment.dlx}
    dead-letter-queue: ${ENROLLMENT_DLQ:campus.enrollment.dlq}
    dead-letter-routing-key: ${ENROLLMENT_DLQ_ROUTING_KEY:campus.enrollment.dead}
    retry-delay: ${ENROLLMENT_RETRY_DELAY:2s}
    max-attempts: ${ENROLLMENT_MAX_ATTEMPTS:3}
    confirm-timeout: ${ENROLLMENT_CONFIRM_TIMEOUT:5s}
