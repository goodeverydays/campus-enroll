server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/campus_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_APP_USER:campus_app}
    password: ${MYSQL_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    phase: 2.5-sso-jwt

campus:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: ${JWT_ISSUER:https://campus-enroll.local}
      audience: ${JWT_AUDIENCE:campus-enroll-api}
      ttl-seconds: ${JWT_TTL_SECONDS:900}
    sso:
      ticket-ttl-seconds: ${SSO_TICKET_TTL_SECONDS:120}
      legacy-system-api-key: ${LEGACY_SYSTEM_API_KEY}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
