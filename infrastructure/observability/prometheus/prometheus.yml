global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway-service:8080]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [auth-service:8081]

  - job_name: student-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [student-service:8082]

  - job_name: course-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [course-service:8083]

  - job_name: enrollment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [enrollment-service:8084]

  - job_name: enrollment-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [enrollment-worker:8085]
